<style>
  :root{
    --ink:#132A3E;
    --paper:#F6F3EC;
    --teal:#1F7A6C;
    --teal-deep:#12554A;
    --amber:#D98E2B;
    --line:#DDD6C7;
    --card:#FFFFFF;
    --muted:#6B7280;
    --danger:#B3413A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:#0F1E2B;
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100vh; padding:20px 0;
  }
  #phone{
    width:390px; max-width:100vw; min-height:800px;
    background:var(--paper); border-radius:34px; overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
    border:8px solid #05131E; position:relative; display:flex; flex-direction:column;
  }
  .screen{ display:none; flex-direction:column; flex:1; min-height:800px;}
  .screen.active{ display:flex; }

  /* ---------- Login ---------- */
  #login{ background:linear-gradient(180deg,var(--teal-deep) 0%, var(--teal) 55%, var(--paper) 55%);
    padding:0; justify-content:flex-start;}
  .brandblock{ padding:56px 28px 20px; color:#fff; }
  .brandblock h1{ font-family:Georgia,'Times New Roman',serif; font-size:30px; margin:0 0 4px; letter-spacing:.3px;}
  .brandblock p{ margin:0; font-size:13px; opacity:.85; }
  .loginform{ background:var(--card); margin:0 20px; border-radius:18px; padding:24px 20px; box-shadow:0 12px 30px rgba(0,0,0,.15); position:relative; top:-8px;}
  .loginform h3{ margin:0 0 14px; font-size:16px; color:var(--ink);}
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; background:#FAF8F3; color:var(--ink);
  }
  .btn{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--teal);
    color:#fff; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .btn.secondary{ background:transparent; color:var(--teal); border:1px solid var(--teal);}
  .btn.amber{ background:var(--amber); }
  .steptext{ font-size:11px; color:var(--muted); text-align:center; margin-top:10px;}
  .otpnote{ font-size:11px; color:var(--teal-deep); background:#EAF4F1; padding:8px 10px; border-radius:8px; margin-bottom:12px;}

  /* ---------- Top App Bar ---------- */
  .appbar{ background:var(--teal-deep); color:#fff; padding:18px 18px 14px; display:flex; align-items:center; justify-content:space-between;}
  .appbar .logo{ font-family:Georgia,serif; font-size:19px; }
  .appbar .sub{ font-size:10px; opacity:.75; margin-top:1px;}
  .avatar{ width:34px;height:34px;border-radius:50%; background:var(--amber); display:flex;align-items:center;justify-content:center; font-size:14px; font-weight:700; color:#fff;}

  /* ---------- Main tabs (Admission / Courses) ---------- */
  .maintabs{ display:flex; background:var(--card); margin:14px 16px 0; border-radius:12px; padding:4px; box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .maintabs button{ flex:1; padding:10px; border:none; background:transparent; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;}
  .maintabs button.active{ background:var(--teal); color:#fff; }

  .content{ flex:1; overflow-y:auto; padding:14px 16px 90px; }

  /* ---------- Admission cards ---------- */
  .adm-card{ background:var(--card); border-radius:16px; margin-bottom:14px; overflow:hidden; border:1px solid var(--line);}
  .adm-head{ padding:14px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .adm-head .tag{ font-size:11px; color:var(--teal-deep); font-weight:700;}
  .adm-head h4{ margin:2px 0 0; font-size:15px; color:var(--ink);}
  .chev{ font-size:16px; color:var(--muted); transition:transform .2s;}
  .adm-body{ display:none; padding:0 16px 16px; }
  .adm-body.open{ display:block; }
  .prog-row{ border-top:1px solid var(--line); padding:10px 0; }
  .prog-row .pname{ font-weight:700; font-size:13px; color:var(--ink);}
  .prog-row .pdet{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5;}
  .reg-link{ display:inline-block; margin-top:8px; font-size:12px; color:#fff; background:var(--amber); padding:7px 14px; border-radius:8px; text-decoration:none; font-weight:600;}
  .exam-links{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .exam-links a{ font-size:11px; color:var(--teal-deep); background:#EAF4F1; padding:6px 10px; border-radius:7px; text-decoration:none; font-weight:600;}

  /* ---------- Courses grid ---------- */
  .grid5{ display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .course-tile{ background:var(--card); border-radius:16px; padding:16px 12px; text-align:center; border:1px solid var(--line); cursor:pointer;}
  .course-tile .ic{ font-size:26px;}
  .course-tile h4{ margin:8px 0 0; font-size:13px; color:var(--ink);}
  .course-tile .cnt{ font-size:10px; color:var(--muted); margin-top:2px;}

  .backbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .backbar button{ border:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; color:var(--ink);}
  .backbar h3{ margin:0; font-size:15px; color:var(--ink);}

  .subprog{ background:var(--card); border-radius:14px; border:1px solid var(--line); margin-bottom:12px; padding:12px 14px; cursor:pointer;}
  .subprog h4{ margin:0 0 3px; font-size:14px; color:var(--ink);}
  .subprog p{ margin:0; font-size:11px; color:var(--muted);}

  .yeartab{ display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; padding-bottom:2px;}
  .yeartab button{ white-space:nowrap; padding:7px 14px; border-radius:20px; border:1px solid var(--line); background:var(--card); font-size:12px; color:var(--ink); cursor:pointer;}
  .yeartab button.active{ background:var(--teal); color:#fff; border-color:var(--teal);}

  .subject-card{ background:var(--card); border-radius:14px; border:1px solid var(--line); padding:12px 14px; margin-bottom:10px;}
  .subject-card h4{ margin:0 0 8px; font-size:13.5px; color:var(--ink);}
  .subject-actions{ display:flex; gap:7px; flex-wrap:wrap;}
  .subject-actions button{ font-size:11px; padding:7px 11px; border-radius:8px; border:1px solid var(--line); background:#FAF8F3; color:var(--ink); cursor:pointer; font-weight:600;}
  .subject-actions button.d3{ background:var(--teal-deep); color:#fff; border:none;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{ position:absolute; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:8px 4px 12px;}
  .bottomnav button{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; color:var(--muted); font-size:10px;}
  .bottomnav button.active{ color:var(--teal-deep); font-weight:700;}
  .bottomnav .ic{ font-size:18px;}

  /* ---------- Modal (syllabus/notes/quiz/3d) ---------- */
  .modal-overlay{ position:absolute; inset:0; background:rgba(10,20,30,.55); display:none; align-items:flex-end; z-index:50;}
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--paper); width:100%; max-height:82%; border-radius:20px 20px 0 0; padding:18px 18px 24px; overflow-y:auto;}
  .modal h3{ margin:0 0 4px; font-size:16px; color:var(--ink);}
  .modal .close{ float:right; border:none; background:var(--line); border-radius:50%; width:26px;height:26px; cursor:pointer;}
  .syll-item{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink);}
  .syll-item span.badge{ font-size:10px; background:#EAF4F1; color:var(--teal-deep); padding:3px 8px; border-radius:6px;}
  .quiz-q{ background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; border:1px solid var(--line);}
  .quiz-opt{ display:block; margin:5px 0; font-size:12px; color:var(--ink);}

  /* 3D cube */
  .scene{ width:100%; height:190px; display:flex; align-items:center; justify-content:center; perspective:800px; margin-bottom:10px;}
  .cube{ width:110px; height:110px; position:relative; transform-style:preserve-3d; animation:spin 9s infinite linear;}
  .face{ position:absolute; width:110px; height:110px; background:rgba(31,122,108,.85); border:2px solid #fff; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; text-align:center; padding:6px;}
  .f1{ transform:translateZ(55px);} .f2{ transform:rotateY(180deg) translateZ(55px);}
  .f3{ transform:rotateY(90deg) translateZ(55px); background:rgba(217,142,43,.85);} .f4{ transform:rotateY(-90deg) translateZ(55px); background:rgba(217,142,43,.85);}
  .f5{ transform:rotateX(90deg) translateZ(55px); background:rgba(18,85,74,.85);} .f6{ transform:rotateX(-90deg) translateZ(55px); background:rgba(18,85,74,.85);}
  @keyframes spin{ from{ transform:rotateX(0deg) rotateY(0deg);} to{ transform:rotateX(360deg) rotateY(360deg);} }

  .hidden{display:none;}
</style>
</head>

    <!-- Step 1: Mobile -->
    <div class="loginform" id="step-mobile">
      <h3>Mobile number se login karein</h3>
      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="mobileInput" placeholder="98xxxxxxxx" maxlength="10">
      </div>
      <button class="btn" onclick="sendOtp()">OTP bhejein</button>
      <div class="steptext">Secure login — aapka number kisi ke saath share nahi hoga</div>
      <div id="recaptcha-container"></div>
    </div>

    <!-- Step 2: OTP -->
    <div class="loginform hidden" id="step-otp">
      <h3>OTP verify karein</h3>
      <div class="otpnote" id="otpMsg">OTP bheja gaya</div>
      <div class="field">
        <label>6-digit OTP</label>
        <input type="tel" id="otpInput" placeholder="••••••" maxlength="6">
      </div>
      <button class="btn" onclick="verifyOtp()">Verify karein</button>
      <button class="btn secondary" style="margin-top:8px" onclick="showStep('step-mobile')">Number badlein</button>
    </div>

    <!-- Step 3: Email -->
    <div class="loginform hidden" id="step-email">
      <h3>Email ID daalein</h3>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="name@example.com">
      </div>
      <button class="btn" onclick="showStep('step-profile')">Aage badhein</button>
    </div>

    <!-- Step 3b: Name & Address -->
    <div class="loginform hidden" id="step-profile">
      <h3>Apni details daalein</h3>
      <div class="field">
        <label>Poora Naam</label>
        <input type="text" id="nameInput" placeholder="e.g. Rahul Sharma">
      </div>
      <div class="field">
        <label>Address</label>
        <input type="text" id="addressInput" placeholder="Gaon/Sheher, Zila, Rajya">
      </div>
      <button class="btn" onclick="showStep('step-course')">Aage badhein</button>
    </div>

    <!-- Step 4: Course selection -->
    <div class="loginform hidden" id="step-course">
      <h3>Aapko kaunsa course chahiye?</h3>
      <div class="field">
        <label>Course select karein</label>
        <select id="courseInput">
          <option value="Pharmacy">Pharmacy</option>
          <option value="Nursing">Nursing</option>
          <option value="NEET">NEET</option>
          <option value="JEE">JEE</option>
          <option value="Polytechnic">Polytechnic</option>
        </select>
      </div>
      <button class="btn amber" onclick="finishLogin()">Dashboard par jaayein</button>
    </div>
  </div>

  <div class="screen" id="dashboard">

let currentUser = { mobile:"", email:"", name:"", address:"", course:"Pharmacy" };
let genOtp = "";
let confirmationResult = null;
let recaptchaVerifier = null;

/* ---------------- LOGIN FLOW ---------------- */
function showStep(id){
  document.querySelectorAll('#login .loginform').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function setupRecaptcha(){
  if(!firebaseReady || recaptchaVerifier) return;
  try{
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size:'invisible' });
  }catch(e){ console.warn('Recaptcha setup failed', e); }
}
window.addEventListener('load', setupRecaptcha);

async function sendOtp(){
  const m = document.getElementById('mobileInput').value.trim();
  if(m.length!==10){ alert("Kripya 10 digit ka valid mobile number daalein"); return; }
  currentUser.mobile = m;

  if(!firebaseReady){
    // Fallback demo OTP — real SMS ke liye upar Firebase config bharein + Phone Auth enable karein
    genOtp = String(Math.floor(100000+Math.random()*900000));
    document.getElementById('otpMsg').innerText = "Demo OTP: "+genOtp+" ("+m+" par bheja gaya — real SMS ke liye Firebase config bharein)";
    showStep('step-otp');
    return;
  }
  try{
    setupRecaptcha();
    const phoneNumber = "+91"+m;
    confirmationResult = await firebase.auth().signInWithPhoneNumber(phoneNumber, recaptchaVerifier);
    document.getElementById('otpMsg').innerText = "Real OTP bheja gaya "+phoneNumber+" par";
    showStep('step-otp');
  }catch(e){
    console.error(e);
    alert("OTP bhejne me dikkat hui. Firebase Console me Phone Authentication enable hai ya nahi check karein.");
  }
}

async function verifyOtp(){
  const o = document.getElementById('otpInput').value.trim();
  if(!firebaseReady){
    if(o!==genOtp){ alert("OTP galat hai. Demo OTP upar dikhaya gaya hai."); return; }
    await checkExistingProfileAndProceed();
    return;
  }
  try{
    await confirmationResult.confirm(o);
    await checkExistingProfileAndProceed();
  }catch(e){
    alert("OTP galat hai, dobara try karein.");
  }
}

/* Agar is mobile number ka profile pehle se saved hai, seedha dashboard khol do.
   Warna pehli baar profile bharne wali screen dikhao. */
async function checkExistingProfileAndProceed(){
  if(firebaseReady && currentUser.mobile){
    try{
      const doc = await window.db.collection('students').doc(currentUser.mobile).get();
      if(doc.exists){
        const data = doc.data();
        currentUser.name = data.name || "Student";
        currentUser.email = data.email || "";
        currentUser.address = data.address || "-";
        currentUser.course = data.course || "Pharmacy";
        enterDashboard();
        return;
      }
    }catch(e){ console.error(e); }
  }
  showStep('step-email'); // naya student — pehli baar profile bharni hogi
}

function saveProfileToFirestore(){
  if(!firebaseReady || !currentUser.mobile) return;
  window.db.collection('students').doc(currentUser.mobile).set({
    name: currentUser.name,
    email: currentUser.email,
    address: currentUser.address,
    course: currentUser.course,
    mobile: currentUser.mobile,
    updatedAt: Date.now()
  }).catch(e=>console.error(e));
}

function enterDashboard(){
  document.getElementById('login').classList.remove('active');
  document.getElementById('dashboard').classList.add('active');
  document.getElementById('welcomeText').innerText = currentUser.name+" • "+currentUser.course;
  document.getElementById('avatarInit').innerText = currentUser.name.charAt(0).toUpperCase();
  bottomNav('home');
}

function finishLogin(){
  currentUser.email = document.getElementById('emailInput').value.trim() || "student@example.com";
  currentUser.name = document.getElementById('nameInput').value.trim() || "Student";
  currentUser.address = document.getElementById('addressInput').value.trim() || "-";
  currentUser.course = document.getElementById('courseInput').value;
  saveProfileToFirestore();
  enterDashboard();
}

        <p style="font-size:12px;color:var(--muted);">${adminMode ? 'Ab aap kisi bhi subject ka syllabus edit/upload kar sakte hain.' : 'Content edit karne ke liye admin login karein.'}</p>
        ${adminMode
          ? `<button class="btn secondary" style="margin-top:8px" onclick="adminLogout()">Admin Logout</button>`
          : `<button class="btn secondary" style="margin-top:8px" onclick="adminLogin()">Admin Login</button>`}
      </div>`;
  } else if(section==='syllabus' || section==='notes' || section==='quiz'){
    document.getElementById('content-area').innerHTML = `
      <div class="subject-card">
        <h4>${section.charAt(0).toUpperCase()+section.slice(1)}</h4>
        <p style="font-size:12.5px;color:var(--muted);">Kisi bhi Course ke andar jaakar subject choose karein — wahan se ${section} seedha khul jayega.</p>
        <button class="btn" style="margin-top:10px" onclick="renderCoursesGrid()">Courses par jaayein</button>
      </div>`;
  }
}

/* Subject-wise syllabus PDF — saved permanently in Firebase (Storage + Firestore) once configured above.
   Falls back to this-session-only storage if Firebase config isn't filled in yet. */
let uploadedSyllabus = {}; // session fallback cache
function syllKey(course,sub,year,subject){
  return (course+"_"+sub+"_"+year+"_"+subject).replace(/[^a-zA-Z0-9_]/g,"_");
}
async function fetchUploadedSyllabus(course,sub,year,subject){
  const key = syllKey(course,sub,year,subject);
  if(!firebaseReady) return uploadedSyllabus[key] || null;
  try{
    const doc = await window.db.collection('syllabus').doc(key).get();
    if(doc.exists) return doc.data();
    return null;
  }catch(e){ console.error(e); return uploadedSyllabus[key] || null; }
}
async function handleSyllabusUpload(evt, course, sub, year, subject){
  const file = evt.target.files[0];
  if(!file) return;
  if(file.type !== 'application/pdf'){ alert('Kripya sirf PDF file upload karein.'); return; }
  const key = syllKey(course,sub,year,subject);

  if(!firebaseReady){
    // session-only fallback (no Firebase config set yet)
    uploadedSyllabus[key] = { name:file.name, url:URL.createObjectURL(file) };
    openModal('syllabus', course, sub, year, subject);
    return;
  }
  try{
    document.getElementById('modalBody').insertAdjacentHTML('beforeend','<p id="uploadStatus" style="font-size:11px;color:var(--muted);text-align:center;">Uploading…</p>');
    const path = `syllabus/${course}/${sub}/${year}/${subject}/${Date.now()}_${file.name}`;
    const ref = window.fbStorage.ref().child(path);
    await ref.put(file);
    const url = await ref.getDownloadURL();
    await window.db.collection('syllabus').doc(key).set({
      name:file.name, url:url, course, sub, year, subject, uploadedAt: Date.now()
    });
    openModal('syllabus', course, sub, year, subject);
  }catch(e){
    console.error(e);
    alert('Upload fail hua — Firebase config/rules check karein. (Console me error dekhein)');
  }
}

/* ---------------- ADMIN MODE ---------------- */
let adminMode = false;
async function adminLogin(){
  if(!firebaseReady){ alert('Pehle upar Firebase config bharein aur Firebase Console > Authentication me Email/Password enable karke apna admin email/password banayein.'); return; }
  const email = prompt('Admin email:');
  if(!email) return;
  const pass = prompt('Admin password:');
  if(!pass) return;
  try{
    await firebase.auth().signInWithEmailAndPassword(email, pass);
    adminMode = true;
    alert('Admin mode ON ✅ — ab syllabus edit/upload kar sakte hain.');
    bottomNav('profile');
  }catch(e){
    alert('Login fail: '+e.message);
  }
}
function adminLogout(){
  if(firebaseReady) firebase.auth().signOut();
  adminMode = false;
  bottomNav('profile');
}
async function fetchSyllabusUnits(course,sub,year,subject){
  const key = syllKey(course,sub,year,subject);
  if(firebaseReady){
    try{
      const doc = await window.db.collection('syllabusUnits').doc(key).get();
      if(doc.exists && doc.data().units) return doc.data().units;
    }catch(e){ console.error(e); }
  }
  return getSyllabus(subject);
}
async function adminEditUnits(course,sub,year,subject){
  if(!adminMode){ alert('Pehle Admin Login karein.'); return; }
  const current = await fetchSyllabusUnits(course,sub,year,subject);
  const input = prompt('Units ko " ; " (semicolon) se separate karke likhein:', current.join(' ; '));
  if(input===null) return;
  const units = input.split(';').map(s=>s.trim()).filter(Boolean);
  if(units.length===0){ alert('Kam se kam ek unit likhein.'); return; }
  const key = syllKey(course,sub,year,subject);
  try{
    await window.db.collection('syllabusUnits').doc(key).set({units, course, sub, year, subject, updatedAt:Date.now()});
    openModal('syllabus', course, sub, year, subject);
  }catch(e){
    console.error(e);
    alert('Save fail hua — Firestore rules check karein.');
  }
}

/* ---------------- MODAL ---------------- */
async function openModal(type, course, sub, year, subject){
  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  let html = `<button class="close" onclick="closeModal()">✕</button><h3>${subject}</h3>
    <p style="font-size:11px;color:var(--muted);margin-top:0;">${course} • ${sub} • ${year}</p>`;

  if(type==='syllabus'){
    body.innerHTML = html + `<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px;">Syllabus load ho raha hai…</p>`;
    overlay.classList.add('open');
    const [units, uploaded] = await Promise.all([
      fetchSyllabusUnits(course,sub,year,subject),
      fetchUploadedSyllabus(course,sub,year,subject)
    ]);
    html += units.map((u,i)=>`<div class="syll-item"><span>Unit ${i+1} — ${u}</span><span class="badge">PDF</span></div>`).join("");
    if(adminMode){
      html += `<button class="btn secondary" style="margin-top:8px;width:100%;" onclick="adminEditUnits('${course}','${sub}','${year}','${subject}')">✏️ Units Edit karein (Admin)</button>`;
    }
    if(uploaded){
      html += `<div class="syll-item" style="border-bottom:none;margin-top:8px;">
          <span>📄 ${uploaded.name}</span>
          <a class="reg-link" style="padding:5px 10px;" href="${uploaded.url}" target="_blank">Kholein</a>
        </div>
        <label class="btn secondary" style="display:block;text-align:center;margin-top:6px;cursor:pointer;">
          Naya PDF Upload karein
          <input type="file" accept="application/pdf" style="display:none" onchange="handleSyllabusUpload(event,'${course}','${sub}','${year}','${subject}')">
        </label>`;
    } else {
      html += `<label class="btn" style="display:block;text-align:center;margin-top:12px;cursor:pointer;">
          Official Syllabus PDF Upload karein
          <input type="file" accept="application/pdf" style="display:none" onchange="handleSyllabusUpload(event,'${course}','${sub}','${year}','${subject}')">
        </label>
        <p style="font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;">College/Board ki official site se PDF download karke yahan upload karein${firebaseReady ? '' : ' (abhi sirf is session ke liye — permanent save ke liye upar Firebase config bharein)'}</p>`;
    }
    body.innerHTML = html;
    return;
  } else if(type==='notes'){
    html += `<div class="syll-item"><span>${subject} — Unit-wise Notes</span><span class="badge">Open</span></div>
      <div class="syll-item"><span>${subject} — Important Questions</span><span class="badge">Open</span></div>
      <div class="syll-item"><span>${subject} — Previous Year Papers</span><span class="badge">Open</span></div>
      <div class="syll-item"><span>${subject} — Short Notes / Revision</span><span class="badge">Open</span></div>`;
  } else if(type==='quiz'){
    html += `<div class="quiz-q">Q1. ${subject} se related ek basic concept question yahan aayega.
      <label class="quiz-opt"><input type="radio" name="q1"> Option A</label>
      <label class="quiz-opt"><input type="radio" name="q1"> Option B</label>
      <label class="quiz-opt"><input type="radio" name="q1"> Option C</label>
      <label class="quiz-opt"><input type="radio" name="q1"> Option D</label>
    </div>
    <div class="quiz-q">Q2. Doosra practice question is subject se.
      <label class="quiz-opt"><input type="radio" name="q2"> Option A</label>
      <label class="quiz-opt"><input type="radio" name="q2"> Option B</label>
    </div>
    <button class="btn" onclick="alert('Demo: Quiz submit hone par score dikhega.')">Quiz Submit karein</button>`;
  } else if(type==='3d'){
    html += `<div class="scene"><div class="cube">
        <div class="face f1">${subject}</div><div class="face f2">Diagram</div>
        <div class="face f3">Front</div><div class="face f4">Side</div>
        <div class="face f5">Top</div><div class="face f6">Base</div>
      </div></div>
      <p style="font-size:11.5px;color:var(--muted);text-align:center;">Rotate hoke label dikhata hai — asli app me is jagah real 3D anatomy/molecule model (e.g. glTF/three.js) load hoga.</p>`;
  }
  body.innerHTML = html;
  overlay.classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
</script>
